<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Network Effects · Personal CRM</title>
<meta name="description" content="Personal CRM para quem conhece muita gente em eventos e reuniões. Roda no navegador, sem servidor.">
<meta name="theme-color" content="#060A14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Network">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<div class="shell">
  <aside class="side">
    <button type="button" class="marca" data-action="perfil" aria-label="Seu perfil" title="Seu perfil"><span id="sigla"></span></button>
    <nav class="tabs" aria-label="Seções">
      <button type="button" data-view="hoje"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Hoje</span><span class="n" id="nFila"></span></button>
      <button type="button" data-view="funil"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span>Funil</span></button>
      <button type="button" data-view="matriz"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Prioridade</span></button>
      <button type="button" data-view="contatos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg><span>Contatos</span></button>
      <button type="button" data-view="conexoes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.9l7.6-3.8M8.2 13.1l7.6 3.8"/></svg><span>Conexões</span></button>
      <button type="button" data-view="atividades"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Atividades</span></button>
      <button type="button" data-view="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Ajustes</span></button>
    </nav>
  </aside>

  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="vol">Personal CRM</span>
        <h1 id="appName">My Network Effects</h1>
      </div>
      <div class="actions">
        <div class="tema-sel" role="group" aria-label="Aparência do app">
          <button type="button" data-action="tema" data-tema="escuro" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg><span>Escuro</span></button>
          <button type="button" data-action="tema" data-tema="claro" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span>Claro</span></button>
        </div>
        <button class="btn" type="button" data-open="importar">Trazer da IA</button>
        <button class="btn primary" type="button" data-open="novo">Novo contato</button>
      </div>
    </header>

    <main id="view"></main>

    <footer class="foot">Feito por <a href="https://www.instagram.com/gracianoamanda/" target="_blank" rel="noopener">@gracianoamanda</a></footer>
  </div>
</div>

<dialog id="dlg" aria-label="Janela do contato"><div id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Este app precisa de JavaScript ligado no navegador.</noscript>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
